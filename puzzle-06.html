<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Puzzle 6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="puzzle-style.css">
    
    <style>
        #game-container {
            max-width: 600px; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 auto;
            box-sizing: border-box;
        }

        #puzzle-image {
            width: auto; 
            max-width: 100%; 
            height: auto;
            max-height: 50vh; 
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            display: block;
        }

        #input-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
        }
        
        @media (max-width: 600px) {
            #input-area { grid-template-columns: 1fr; }
            #game-container { padding: 10px; }
        }
    </style>
</head>
<body>
    <canvas id="snow-canvas"></canvas>
    
    <div class="container">
        <div class="puzzle-box">
            <h1>Puzzle 6: Spot the Differences</h1>
            <p class="instructions">Find six things that are different in the photo below vs our holiday card.</p>
            
            <div id="game-container" class="game-frame">
                <img src="selfie.jpg" id="puzzle-image" alt="Selfie">

                <div id="input-area">
                    <input type="text" class="answer-input" placeholder="Difference 1">
                    <input type="text" class="answer-input" placeholder="Difference 2">
                    <input type="text" class="answer-input" placeholder="Difference 3">
                    <input type="text" class="answer-input" placeholder="Difference 4">
                    <input type="text" class="answer-input" placeholder="Difference 5">
                    <input type="text" class="answer-input" placeholder="Difference 6">
                </div>

                <button class="btn-style" onclick="checkAnswers()">Submit</button>

                <div id="ui-layer" class="ui-layer hidden-ui">
                    <div id="win-screen">
                        <div class="game-msg">Sharp eyes!</div>
                        <button class="btn-style" id="next-level-btn" onclick="goToNextLevel('puzzle-07.html')">Next puzzle</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="spacer-large"></div>
        <div class="hidden-clue" aria-live="polite">6. ······</div>
    </div>

    <script src="utils.js"></script>
    <script src="hunt-core.js"></script>
    <script src="hunt-data.js"></script>
    <script src="hunt.js"></script>
    <script>
        const uiLayer = document.getElementById('ui-layer');
        Hunt.page(6);

        async function checkAnswers() {
            const inputElements = document.querySelectorAll('.answer-input');
            const fields = Array.from(inputElements, el => el.value);
            // split: one accepted word anywhere in a field is enough ("a big mustache").
            const result = await Hunt.solve(fields, { split: true });
            if (result === 'locked') return;

            if (result === 'solved') {
                playSound('win');
                uiLayer.classList.remove('hidden-ui');
                uiLayer.classList.add('active-ui');
            } else {
                playSound('slide');
                inputElements.forEach(el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); });
            }
        }
        
        /* --- SNOW ANIMATION --- */
        const canvas = document.getElementById("snow-canvas");
        const ctx = canvas.getContext("2d");
        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        const particles = [];
        const particleCount = 100;

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = Math.random() * 3 + 1;
                this.speedY = Math.random() * 1 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.3;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y > height) this.y = 0;
                if (this.x > width) this.x = 0;
                if (this.x < 0) this.x = width;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        });
    </script>
</body>
</html>
