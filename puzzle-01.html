<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Puzzle 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="puzzle-style.css">
</head>
<body>
    <canvas id="snow-canvas"></canvas>
    
    <div class="container">
        <div class="puzzle-box">
            <h1>Puzzle 1: Sum Total</h1>
            <p class="question">Add the ages of Emma, Owen and Lainey.<br>What do you get?</p>
            <input type="number" pattern="\d*" id="answerInput" placeholder="Type your answer..." autocomplete="off">
            <br>
            <button onclick="checkAnswer()">Submit</button>
            <p id="error" class="error-msg">Incorrect. Try again.</p>

            <div id="ui-layer" class="ui-layer hidden-ui">
                <div class="game-msg">It all adds up!</div>
                <button class="btn-style" onclick="goToNextLevel('puzzle-02.html')">Next puzzle</button>
            </div>
        </div>

        <div class="spacer-large"></div>
        <div class="hidden-clue" aria-live="polite">1. ······</div>
    </div>

    <script src="utils.js"></script>
    <script src="hunt-core.js"></script>
    <script src="hunt-data.js"></script>
    <script src="hunt.js"></script>
    <script src="snow.js"></script>
    <script>
        Hunt.page(1);

        async function checkAnswer() {
            const result = await Hunt.solve([document.getElementById('answerInput').value]);
            if (result === 'locked') return;

            if (result === 'solved') {
                playSound('win');
                const ui = document.getElementById('ui-layer');
                ui.classList.remove('hidden-ui');
                ui.classList.add('active-ui');
            } else {
                const err = document.getElementById('error');
                err.style.display = 'block';
                setTimeout(() => err.style.display = 'none', 2000);
            }
        }

        document.getElementById("answerInput").addEventListener("keyup", function(event) {
            if (event.key === "Enter") checkAnswer();
        });
    </script>
</body>
</html>
